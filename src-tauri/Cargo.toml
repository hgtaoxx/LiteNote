[package]
name = "LiteNote"
version = "1.7.0"
description = "A Tauri App"
authors = ["秋枫"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "litenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
aes-gcm = "0.10"
base64 = "0.22"
http = "1"
rand = "0.8"

# 仅 Windows：锁定窗口时剥掉 TAO 无条件加上的标题栏 / 系统菜单样式
# （见 lib.rs 的 set_window_frame_styles —— 这是「不能移动」的关键）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

# 体积优化：Rust 默认的 release 档是「编译快」优先 —— codegen-units=16 不跨单元
# 内联、符号表留在 exe 里。这两项是 exe 从几 MB 涨到 18 MB 的主因（前端资源只占 0.7 MB）。
# 代价是全量重编依赖、链接时间变长。
[profile.release]
codegen-units = 1
lto = "fat"
# 原先是 strip = "symbols"：省下来的那点体积，代价是 PDB 里只剩 743 个函数，
# 崩溃/挂起的 dump 读不出栈（深帧全是栈扫描噪音），等于出问题只能猜。
# MSVC 的调试信息本来就在 PDB 里、不随 exe 分发，所以放开后包体几乎不变。
strip = false
debug = 1
opt-level = "z"
# 原先是 panic = "abort"：任何 panic 直接 __fastfail 打死进程（事件日志里那条
# 0xc0000409 就是这么来的），而且 strip 之后连栈都读不出来。
# 改回默认 unwind 只在「可 unwind 的地方」有效（tokio 任务、spawn_blocking 里的 panic
# 会被 JoinError 吃掉）。实测：命令处理走的是 extern "C" 边界，panic 到那儿仍会变成
# "panic in a function that cannot unwind" 而终止进程——这点别当成已经防住了。
# 真正的收益是 setup 里的 panic hook 会在终止前把文件与行号写进 run.log。

